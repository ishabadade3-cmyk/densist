name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
        env:
          ALLOW_UNVERIFIED_CONTENT: "1"

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_DB: dental_test
          POSTGRES_USER: dental_test
          POSTGRES_PASSWORD: dental_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dental_test -d dental_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://dental_test:dental_test_password@localhost:5432/dental_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/api/requirements.txt
      - run: ruff check app tests migrations
        working-directory: apps/api
      - run: pytest
        working-directory: apps/api

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d db api
      - run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8000/api/v1/health; then
              echo ""
              echo "API healthy after $((attempt * 3))s"
              exit 0
            fi
            echo "Waiting for API... attempt $attempt/40"
            sleep 3
          done
          echo "API did not become healthy in time"
          docker compose logs api
          exit 1
      - if: always()
        run: docker compose down --volumes

